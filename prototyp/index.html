<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Treatment Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: App-Shell – Seitenleiste (Desktop) / untere Tab-Leiste (Mobil), Arbeitsfläche rechts */
:root{
  --bg:#eef2f3; --surface:#ffffff; --surface-2:#e4eaec; --fg:#16232a; --muted:#566871; --line:#d3dce0;
  --accent:#1d5e69; --accent-fg:#ffffff; --accent-soft:#d6e9ec;
  --ok:#2b7149; --ok-soft:#dcefe3; --warn:#9a5f0c; --warn-soft:#f6e8cf; --bad:#a83737; --bad-soft:#f6dddd;
  --shadow:0 10px 30px rgba(18,40,48,.16);
  --c1:#00809a; --c2:#c4762c;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --hour:52px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171b; --surface:#162127; --surface-2:#1d2a31; --fg:#e2eaed; --muted:#93a5ad; --line:#2a3a42;
  --accent:#72b8c4; --accent-fg:#0b191c; --accent-soft:#1b3a41;
  --ok:#6cc290; --ok-soft:#173326; --warn:#e3a94e; --warn-soft:#3a2c14; --bad:#ee8080; --bad-soft:#3d1d1f;
  --shadow:0 10px 30px rgba(0,0,0,.5); --c1:#1c9aad; --c2:#c87a30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171b; --surface:#162127; --surface-2:#1d2a31; --fg:#e2eaed; --muted:#93a5ad; --line:#2a3a42;
  --accent:#72b8c4; --accent-fg:#0b191c; --accent-soft:#1b3a41;
  --ok:#6cc290; --ok-soft:#173326; --warn:#e3a94e; --warn-soft:#3a2c14; --bad:#ee8080; --bad-soft:#3d1d1f;
  --shadow:0 10px 30px rgba(0,0,0,.5); --c1:#1c9aad; --c2:#c87a30; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Buttons & Felder */
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);padding:.5rem .9rem;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:.3rem .6rem;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.field label{font-size:.85rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.5rem .65rem;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:60px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.grid3{display:grid;grid-template-columns:2fr 1fr 2fr;gap:.75rem}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding-inline:16px;padding-block:32px}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:1rem}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg)}
.proto-note{font-size:.85rem;background:var(--warn-soft);color:var(--warn);padding:.6rem .75rem;border-radius:8px}

/* Shell */
.shell{display:grid;grid-template-columns:220px 1fr;height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:.65rem;border:0;background:transparent;padding:.55rem .7rem;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:19px;height:19px;flex:none}
.nav .badge{margin-left:auto;background:var(--warn-soft);color:var(--warn);font-size:.75rem;padding:0 .45rem;border-radius:99px}
.side-foot{margin-top:auto;font-size:.85rem;display:flex;flex-direction:column;gap:.4rem}
.main{min-width:0;overflow:auto;padding-inline:24px;padding-block:20px 40px}
.page-head{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:16px}
.page-head .spacer{flex:1}
.demo-strip{font-size:.85rem;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:.45rem .75rem;margin-bottom:14px}
@media (max-width:760px){
  .shell{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{position:fixed;left:0;right:0;bottom:0;z-index:20;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}
  .side .brand,.side-foot{display:none}
  .nav{flex-direction:row;flex:1;justify-content:space-around}
  .nav button{flex-direction:column;gap:2px;font-size:.7rem;padding:.35rem .3rem}
  .nav .badge{display:none}
  .main{padding-inline:16px;padding-bottom:90px}
}

/* Karten / Listen */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:.6rem .8rem;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--surface-2)}
.pill{display:inline-block;font-size:.78rem;font-weight:600;padding:.1rem .55rem;border-radius:99px;white-space:nowrap}
.s-geplant{background:var(--accent-soft);color:var(--accent)}
.s-durchgefuehrt,.s-bezahlt{background:var(--ok-soft);color:var(--ok)}
.s-ausgefallen,.s-offen{background:var(--warn-soft);color:var(--warn)}
.s-abgesagt,.s-storniert{background:var(--surface-2);color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Kalender */
.cal-bar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.cal-title{font-family:var(--f-display);font-weight:700;font-size:1.05rem;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:.4rem .75rem;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.cal{margin-top:12px;overflow:hidden}
.cal-head{display:grid;border-bottom:1px solid var(--line)}
.cal-head div{padding:.5rem .4rem;text-align:center;font-weight:600;font-size:.88rem;border-left:1px solid var(--line)}
.cal-head div:first-child{border-left:0}
.cal-head .today{color:var(--accent)}
.cal-head .today b{background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:0 .4rem}
.cal-body{display:grid;max-height:calc(100vh - 210px);min-height:360px;overflow-y:auto;position:relative}
.cal-times div{height:var(--hour);font-size:.75rem;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-.55em)}
.cal-day{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hour));cursor:copy}
.cal-day.today{background-color:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
.ev{position:absolute;left:3px;right:3px;border-radius:7px;padding:.25rem .4rem;font-size:.8rem;line-height:1.25;overflow:hidden;cursor:pointer;border:1px solid transparent;text-align:left}
.ev:hover{box-shadow:var(--shadow);z-index:2}
.ev b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.ev.s-abgesagt{text-decoration:line-through;border-style:dashed;border-color:var(--line)}
.ev.billed::after{content:"€";position:absolute;top:3px;right:6px;font-weight:700}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:3;pointer-events:none}
.legend{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:10px;font-size:.82rem}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,20,25,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding-inline:16px;padding-block:5vh;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:620px;display:flex;flex-direction:column}
.modal.wide{max-width:820px}
.modal-head{display:flex;align-items:center;gap:.5rem;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{flex:1}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:1rem}
.modal-foot{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.modal-foot .left{margin-right:auto;display:flex;gap:.5rem;flex-wrap:wrap}
.section{display:flex;flex-direction:column;gap:.65rem}
.tabs-mini{display:inline-flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px;align-self:flex-start}
.tabs-mini button{border:0;background:transparent;padding:.35rem .8rem;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs-mini button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.search-wrap{position:relative}
.suggest{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:5;max-height:220px;overflow:auto}
.suggest button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:.5rem .7rem;cursor:pointer}
.suggest button:hover,.suggest button.hl{background:var(--surface-2)}
.chosen{display:flex;align-items:center;gap:.6rem;background:var(--accent-soft);border-radius:8px;padding:.55rem .75rem}
.chosen div{flex:1;min-width:0}
.items{display:flex;flex-direction:column;gap:.4rem}
.item-row{display:flex;gap:.5rem;align-items:center}
.item-row select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.5rem .6rem}
.sum{display:flex;justify-content:space-between;font-weight:700;border-top:1px solid var(--line);padding-top:.5rem}
.alert{font-size:.88rem;padding:.55rem .75rem;border-radius:8px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.status-pick{display:flex;gap:.35rem;flex-wrap:wrap}
.status-pick button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.3rem .75rem;cursor:pointer;font-weight:600;font-size:.88rem}
.status-pick button[aria-pressed="true"]{border-color:currentColor}

/* Rechnungsvorschau (Papier) */
.paper{background:#fff;color:#1b1b1b;border:1px solid var(--line);border-radius:6px;padding:28px 30px;font-size:12.5px;line-height:1.45;font-family:var(--f-body)}
.paper .p-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.paper .p-sender{font-size:9.5px;color:#666;border-bottom:1px solid #999;display:inline-block;margin-bottom:6px}
.paper h3{font-family:var(--f-display);font-size:18px;margin:22px 0 4px;color:#1b1b1b}
.paper table th{color:#666;font-size:10px}
.paper th,.paper td{border-bottom:1px solid #ddd;padding:.4rem .4rem}
.paper .p-total td{font-weight:700;border-top:2px solid #333;border-bottom:0}
.paper .p-foot{margin-top:22px;font-size:10.5px;color:#555;border-top:1px solid #ccc;padding-top:8px;display:flex;gap:18px;flex-wrap:wrap}
.paper-wrap{overflow-x:auto}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:9px;font-weight:600;z-index:80;box-shadow:var(--shadow)}
@media (max-width:760px){.toast{bottom:90px}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.bill-card{padding:14px 16px;display:flex;flex-direction:column;gap:.5rem}
.bill-card ul{margin:0;padding-left:1.1rem;font-size:.9rem}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:12px 14px}
.kpi .v{font-family:var(--f-display);font-size:1.35rem;font-weight:700}
@media (max-width:560px){.kpis{grid-template-columns:1fr}}

/* Monatsansicht */
.month{margin-top:12px;overflow:hidden}
.mhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.mhead div{padding:.5rem .4rem;text-align:center;font-weight:600;font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mcell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:.35rem .35rem .4rem;min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:.25rem;background:var(--surface)}
.mcell:nth-child(7n){border-right:0}
.mcell:hover{background:var(--surface-2)}
.mcell.out{background:var(--bg)}
.mcell.out .mnum{color:var(--muted);opacity:.7}
.mcell.today .mnum .num:first-child{background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:0 .4rem}
.mnum{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.88rem}
.mcount{font-size:.72rem;font-weight:600;color:var(--muted)}
.mchips{display:flex;flex-direction:column;gap:2px;min-width:0}
.mchip{border:0;text-align:left;font-size:.76rem;padding:.12rem .35rem;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;position:relative}
.mchip.s-abgesagt{text-decoration:line-through}
.mchip.billed::after{content:"€";margin-left:.25rem;font-weight:700}
.mchip:hover{filter:brightness(.96)}
.mmore{font-size:.74rem;color:var(--muted);padding-left:.3rem}
.mdots{display:none;gap:3px;flex-wrap:wrap}
.mdots i{width:7px;height:7px;border-radius:99px;display:block}
.mdots i.s-geplant{background:var(--accent)}
.mdots i.s-durchgefuehrt{background:var(--ok)}
.mdots i.s-ausgefallen{background:var(--warn)}
.mdots i.s-abgesagt{background:var(--line)}
@media (max-width:640px){
  .mgrid{grid-template-rows:none!important;grid-auto-rows:64px}
  .mchips,.mcount{display:none}
  .mdots{display:flex}
  .mhead div{font-size:.7rem;padding:.4rem .1rem}
}

/* Statistik */
.kpis4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.kpis4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.kpis4{grid-template-columns:1fr}}
.up{color:var(--ok);font-weight:600}.down{color:var(--bad);font-weight:600}
.chart-card{padding:16px 18px}
.chart-head{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start;margin-bottom:8px}
.legend-row{display:flex;gap:1rem;font-size:.88rem;color:var(--muted)}
.legend-row span{display:inline-flex;align-items:center;gap:.4rem}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.chart{position:relative;min-width:0}
.chart svg{display:block;max-width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.chart .axis{stroke:var(--muted);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chart .dlabel{fill:var(--fg);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.chart .slabel{fill:var(--fg);font-size:12.5px}
.chart .hl{fill:var(--surface-2)}
.chart .hit{cursor:pointer}
.tip{position:absolute;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:9px;padding:.55rem .7rem;font-size:.85rem;min-width:190px;pointer-events:none;z-index:4}
.tip .tr{display:flex;align-items:center;gap:.45rem;margin-top:.2rem}
.tip .tr span{margin-left:auto;padding-left:1rem}
.tip .tot{border-top:1px solid var(--line);padding-top:.25rem;font-weight:700}
.tbl-toggle{margin-top:10px}
.tbl-toggle summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem}
.tbl-toggle table{margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>

<script>
(function(){
"use strict";
/* ---------- Hilfsfunktionen ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const eur = n => new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"}).format(n||0);
const eurPdf = n => new Intl.NumberFormat("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0) + " EUR";
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const parseLocal = s => { const [d,t="00:00"] = s.split("T"); const [y,m,da] = d.split("-").map(Number); const [h,mi] = t.split(":").map(Number); return new Date(y,m-1,da,h,mi); };
const toLocalStr = d => `${ymd(d)}T${hm(d)}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const addMin = (d,n) => new Date(d.getTime()+n*60000);
const startOfWeek = d => { const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); const wd = (x.getDay()+6)%7; return addDays(x,-wd); };
const fmtDate = d => d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
const fmtDay = d => d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});
const WD = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const DAY_START = 7, DAY_END = 21;
const STATUS = {
  geplant:{label:"Geplant"}, durchgefuehrt:{label:"Durchgeführt"},
  ausgefallen:{label:"Nicht erschienen"}, abgesagt:{label:"Abgesagt"}
};
const INV_STATUS = {offen:"Offen", bezahlt:"Bezahlt", storniert:"Storniert"};

/* ---------- Speicher (nur dieser Browser) ----------
   DB = { v, accounts:[...], session:accountId|null, data:{ [accountId]: Praxisdaten } }
   S  = Praxisdaten des angemeldeten Kontos (Admins haben keine) */
const KEY = "treatment-manager-proto-v2";
let memoryStore = null;
function loadDB(){ try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){} return memoryStore ? JSON.parse(memoryStore) : null; }
function save(){ const s = JSON.stringify(DB); memoryStore = s; try{ localStorage.setItem(KEY,s); }catch(e){} }
// Nur für den Prototyp: einfacher Hash. In der echten App übernimmt das der Auth-Server (bcrypt/argon2).
function hashPw(str){ let h1=0xdeadbeef, h2=0x41c6ce57; for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677);} h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return (4294967296*(2097151&h2)+(h1>>>0)).toString(36); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function seedPractice(){
  const now = new Date();
  const services = [
    {id:"s1",name:"Erstanamnese & Untersuchung",code:"",duration:60,price:90,active:true},
    {id:"s2",name:"Folgebehandlung",code:"",duration:45,price:65,active:true},

    {id:"s4",name:"Schröpfmassage",code:"",duration:30,price:40,active:true},
    {id:"s5",name:"Infusionstherapie",code:"",duration:45,price:55,active:true},
    {id:"s6",name:"Telefonische Beratung",code:"",duration:15,price:20,active:true}
  ];
  const P = [["Lena","Beispiel","Lindenstraße 12","10115","Berlin","1987-04-12"],["Jonas","Muster","Am Hang 3","14467","Potsdam","1975-09-30"],
    ["Aylin","Probe","Gartenweg 8a","10997","Berlin","1992-01-05"],["Peter","Testmann","Bahnhofstr. 40","12555","Berlin","1961-11-21"],
    ["Sofia","Exempel","Kastanienallee 7","10435","Berlin","1983-06-18"],["Karl","Vorlage","Dorfstraße 2","15344","Strausberg","1958-02-27"],
    ["Mia","Fiktiv","Rosenweg 15","12203","Berlin","1999-08-09"],["Emre","Platzhalter","Sonnenallee 101","12045","Berlin","1979-12-01"],
    ["Greta","Demo","Seestraße 33","13353","Berlin","1968-03-14"],["Luca","Musterle","Ahornring 4","14532","Kleinmachnow","1990-10-22"],
    ["Hanna","Schablone","Parkweg 9","10827","Berlin","1972-05-30"],["Tobias","Entwurf","Ringstraße 21","12105","Berlin","1985-07-04"]];
  const patients = P.map((p,i)=>({id:"p"+(i+1),first:p[0],last:p[1],street:p[2],zip:p[3],city:p[4],birth:p[5],phone:i%3?"030 55"+(10000+i*731):"",email:i%2?"":p[0].toLowerCase()+"@example.org",createdAt:"2025-01-02"}));
  const rnd = mulberry32(20260106);
  const pick = arr => arr[Math.floor(rnd()*arr.length)];
  const combos = [["s2"],["s2"],["s3"],["s2","s3"],["s4"],["s3","s4"],["s5"],["s6"],["s2","s4"]];
  const appts = [];
  const from = new Date(now.getFullYear()-1,0,1), until = addDays(startOfWeek(now),12);
  const seen = new Set();
  for(let d=new Date(from); d<until; d=addDays(d,1)){
    const wd=(d.getDay()+6)%7; if(wd>4) continue;
    // Sommerpause & Weihnachten etwas ruhiger, langsames Wachstum der Praxis
    const growth = 1 + (d - from)/(1000*3600*24*365)*0.25;
    const season = [0.9,1,1.05,1,0.95,0.85,0.6,0.7,1,1.05,1.1,0.75][d.getMonth()];
    const n = Math.round((1.4 + rnd()*1.8) * growth * season);
    const hours = [8,9,10,11,13,14,15,16,17].sort(()=>rnd()-.5).slice(0,n).sort((a,b)=>a-b);
    hours.forEach(h=>{
      const p = pick(patients); const first = !seen.has(p.id); seen.add(p.id);
      const sids = first ? ["s1"] : pick(combos);
      const st = new Date(d); st.setHours(h, rnd()<.3?30:0, 0, 0);
      const dur = sids.reduce((a,id)=>a+services.find(s=>s.id===id).duration,0);
      const past = addMin(st,dur) < now; const r = rnd();
      const status = past ? (r<.05?"ausgefallen":r<.09?"abgesagt":"durchgefuehrt") : (r<.04?"abgesagt":"geplant");
      appts.push({id:uid(),patientId:p.id,start:toLocalStr(st),duration:dur,serviceIds:sids,status,note:"",invoiceId:null});
    });
  }
  const state = {
    practice:{name:"Naturheilpraxis am Kanal",owner:"Maria Beispiel",title:"Heilpraktikerin",street:"Uferweg 5",zip:"10999",city:"Berlin",phone:"030 5550100",email:"praxis@example.org",taxNo:"12/345/67890",iban:"DE02 1203 0000 0000 2020 51",bank:"Beispielbank",taxMode:"p4",payDays:14},
    services, patients, appts, invoices:[], counters:{}
  };
  // Monatliche Sammelrechnungen für alle abgeschlossenen Monate
  const prev = S; S = state;
  for(let m=new Date(from); m < new Date(now.getFullYear(),now.getMonth(),1); m=new Date(m.getFullYear(),m.getMonth()+1,1)){
    const key = ymd(m).slice(0,7);
    const invDate = new Date(m.getFullYear(),m.getMonth()+1,2);
    const byP = {};
    appts.filter(a=>a.status==="durchgefuehrt"&&a.start.startsWith(key)).forEach(a=>(byP[a.patientId]=byP[a.patientId]||[]).push(a.id));
    Object.keys(byP).sort().forEach(pid=>{
      const inv = createInvoice(pid, byP[pid], ymd(invDate));
      const age = (now - invDate)/(1000*3600*24);
      if(age > 35 || (age > 10 && rnd() < .6)){ inv.status="bezahlt"; inv.paidAt = ymd(addDays(invDate, 5+Math.floor(rnd()*20))); }
    });
  }
  S = prev;
  return state;
}

const pat = id => S.patients.find(p=>p.id===id);

const billable = () => S.appts.filter(a=>a.status==="durchgefuehrt" && !a.invoiceId && a.serviceIds.length);

function overlaps(start,duration,ignoreId){
  const s = parseLocal(start), e = addMin(s,duration);
  return S.appts.filter(a=>a.id!==ignoreId && a.status!=="abgesagt").filter(a=>{
    const as = parseLocal(a.start), ae = addMin(as,a.duration);
    return as < e && s < ae;
  });
}

function nextInvoiceNumber(y){
  S.counters = S.counters || {};
  S.counters[y] = (S.counters[y]||0) + 1;
  return `RE-${y}-${String(S.counters[y]).padStart(4,"0")}`;
}

/* Preise werden beim Erstellen der Rechnung eingefroren (Snapshot) */
function createInvoice(patientId, apptIds, dateStr){
  const p = pat(patientId); if(!p) return null;
  const appts = apptIds.map(id=>S.appts.find(a=>a.id===id)).filter(Boolean).sort((a,b)=>a.start.localeCompare(b.start));
  if(!appts.length) return null;
  const lines = [];
  appts.forEach(a=>a.serviceIds.forEach(sid=>{ const s=svc(sid); if(s) lines.push({date:a.start.slice(0,10),name:s.name,code:s.code||"",qty:1,price:s.price}); }));
  const date = dateStr || ymd(new Date());
  const inv = {
    id:uid(), number:nextInvoiceNumber(date.slice(0,4)), patientId, date, payDays:S.practice.payDays||14,
    patient:{name:pname(p),street:p.street,zip:p.zip,city:p.city,birth:p.birth},
    practice:JSON.parse(JSON.stringify(S.practice)),
    lines, total:lines.reduce((t,l)=>t+l.qty*l.price,0), status:"offen", apptIds:appts.map(a=>a.id),
    period:[appts[0].start.slice(0,10), appts[appts.length-1].start.slice(0,10)]
  };
  S.invoices.push(inv);
  appts.forEach(a=>a.invoiceId=inv.id);
  return inv;
}

function cancelInvoice(inv){
  inv.status = "storniert";
  inv.cancelledAt = ymd(new Date());
  S.appts.forEach(a=>{ if(a.invoiceId===inv.id) a.invoiceId=null; });
}

function timeGrid(host,view,todayStr){
  const days = view==="tag" ? [new Date(UI.cursor.getFullYear(),UI.cursor.getMonth(),UI.cursor.getDate())] : Array.from({length:6},(_,i)=>addDays(startOfWeek(UI.cursor),i));
  const cols = `56px repeat(${days.length},minmax(0,1fr))`;
  const hours = Array.from({length:DAY_END-DAY_START},(_,i)=>DAY_START+i);
  host.innerHTML = `<div class="panel cal">
      <div class="cal-head" style="grid-template-columns:${cols}"><div></div>${days.map(d=>`<div class="${ymd(d)===todayStr?"today":""}">${WD[(d.getDay()+6)%7]} <b class="num">${d.getDate()}.</b></div>`).join("")}</div>
      <div class="cal-body" id="calBody" style="grid-template-columns:${cols}">
        <div class="cal-times">${hours.map(h=>`<div class="num">${h===DAY_START?"":pad(h)+":00"}</div>`).join("")}</div>
        ${days.map(d=>`<div class="cal-day ${ymd(d)===todayStr?"today":""}" data-day="${ymd(d)}" style="height:calc(var(--hour) * ${hours.length})"></div>`).join("")}
      </div></div>`;
  const hourPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour"))||52;
  days.forEach(d=>{
    const col = host.querySelector(`.cal-day[data-day="${ymd(d)}"]`);
    const list = S.appts.filter(a=>a.start.slice(0,10)===ymd(d)).sort((a,b)=>a.start.localeCompare(b.start));
    const lanes=[]; const lane=new Map(); list.forEach(a=>{ const s=parseLocal(a.start); let i=lanes.findIndex(end=>end<=s); if(i<0){i=lanes.length;lanes.push(0);} lanes[i]=addMin(s,a.duration); lane.set(a.id,i); });
    const nL = Math.max(1,lanes.length);
    list.forEach(a=>{
      const s=parseLocal(a.start); const top=((s.getHours()+s.getMinutes()/60)-DAY_START)*hourPx; const h=Math.max(22,a.duration/60*hourPx-2);
      const el=document.createElement("button");
      el.className=`ev s-${a.status}${a.invoiceId?" billed":""}`;
      el.style.top=top+"px"; el.style.height=h+"px";
      if(nL>1){ el.style.left=`calc(${lane.get(a.id)/nL*100}% + 3px)`; el.style.right="auto"; el.style.width=`calc(${100/nL}% - 6px)`; }
      el.innerHTML=`<b>${hm(s)} ${esc(pname(pat(a.patientId)))}</b><span>${esc(apptTitle(a))}</span>`;
      el.title=`${hm(s)}–${hm(addMin(s,a.duration))} · ${pname(pat(a.patientId))} · ${STATUS[a.status].label}`;
      el.onclick=ev=>{ ev.stopPropagation(); openAppt(a.id); };
      col.appendChild(el);
    });
    if(ymd(d)===todayStr){ const n=new Date(); const t=((n.getHours()+n.getMinutes()/60)-DAY_START)*hourPx; if(t>0&&t<hourPx*hours.length){ const l=document.createElement("div"); l.className="now-line"; l.style.top=t+"px"; col.appendChild(l);} }
    col.onclick=ev=>{ const mins=Math.floor((ev.offsetY/hourPx)*60/15)*15; const dt=new Date(d); dt.setHours(DAY_START,0,0,0); dt.setMinutes(mins); openAppt(null,toLocalStr(dt)); };
  });
  host.querySelector("#calBody").scrollTop = hourPx;
}
function monthGrid(host,todayStr){
  const first=new Date(UI.cursor.getFullYear(),UI.cursor.getMonth(),1), start=startOfWeek(first), last=new Date(first.getFullYear(),first.getMonth()+1,0);
  const weeks=Math.ceil((Math.round((last-start)/86400000)+1)/7);
  const byDay={}; S.appts.forEach(a=>{ const k=a.start.slice(0,10); (byDay[k]=byDay[k]||[]).push(a); });
  Object.values(byDay).forEach(l=>l.sort((a,b)=>a.start.localeCompare(b.start)));
  const MAX=3; let cells="";
  for(let i=0;i<weeks*7;i++){
    const d=addDays(start,i), k=ymd(d), list=byDay[k]||[], active=list.filter(a=>a.status!=="abgesagt"), out=d.getMonth()!==first.getMonth();
    cells+=`<div class="mcell${out?" out":""}${k===todayStr?" today":""}" data-day="${k}" role="button" tabindex="0" aria-label="${fmtDate(d)}, ${active.length} Termine">
      <div class="mnum"><span class="num">${d.getDate()}</span>${active.length?`<span class="mcount num">${active.length}</span>`:""}</div>
      <div class="mchips">${list.slice(0,MAX).map(a=>`<button class="mchip s-${a.status}${a.invoiceId?" billed":""}" data-aid="${a.id}" title="${esc(a.start.slice(11,16)+" "+pname(pat(a.patientId))+" · "+apptTitle(a))}"><span class="num">${a.start.slice(11,16)}</span> ${esc(pat(a.patientId)?.last||"")}</button>`).join("")}
        ${list.length>MAX?`<span class="mmore">+${list.length-MAX} weitere</span>`:""}</div>
      <div class="mdots">${list.slice(0,6).map(a=>`<i class="s-${a.status}"></i>`).join("")}</div></div>`;
  }
  host.innerHTML=`<div class="panel month"><div class="mhead">${WD.map(w=>`<div>${w}</div>`).join("")}</div><div class="mgrid" style="grid-template-rows:repeat(${weeks},minmax(92px,auto))">${cells}</div></div>`;
  $$(".mchip",host).forEach(b=>b.onclick=e=>{ e.stopPropagation(); openAppt(b.dataset.aid); });
  $$(".mcell",host).forEach(c=>{ const open=()=>{ UI.cursor=parseLocal(c.dataset.day); UI.view="tag"; render(); }; c.onclick=open; c.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } }; });
}

function modal(html,{wide=false}={}){

  ov.innerHTML=`<div class="modal ${wide?"wide":""}" role="dialog" aria-modal="true">${html}</div>`;

}

  const ov = modal(`

      </div>
      <div class="section"><span class="label">Behandlung</span><div class="items" id="items"></div>

        ${Object.entries(STATUS).map(([k,v])=>`<button type="button" class="s-${k}" data-st="${k}" aria-pressed="${a.status===k}" ${locked?"disabled":""}>${v.label}</button>`).join("")}
      </div></div>

    </div>`);
  $$("[data-close]",ov).forEach(b=>b.onclick=closeModal);

  const newP = {first:"",last:"",street:"",zip:"",city:"",birth:"",phone:"",email:""};

      return;
    }
    box.innerHTML=`<div class="tabs-mini" role="group"><button type="button" data-m="search" aria-pressed="${mode==="search"}">Bestehender Patient</button><button type="button" data-m="new" aria-pressed="${mode==="new"}">Neuer Patient</button></div><div id="patInner" style="margin-top:.6rem"></div>`;
    $$("[data-m]",box).forEach(b=>b.onclick=()=>{mode=b.dataset.m;renderPat();});
    const inner=$("#patInner");
    if(mode==="search"){
      inner.innerHTML=`<div class="search-wrap"><div class="field"><label for="ap-search">Name suchen</label><input id="ap-search" autocomplete="off" placeholder="z. B. Beispiel"></div><div class="suggest" id="sugg" hidden></div></div>`;
      const inp=$("#ap-search"), sg=$("#sugg");
      const show=()=>{ const q=inp.value.trim().toLowerCase();
        const res=S.patients.filter(p=>!q||pname(p).toLowerCase().includes(q)).slice(0,8);
        sg.innerHTML = res.length ? res.map(p=>`<button type="button" data-pid="${p.id}"><strong>${esc(pname(p))}</strong> <span class="muted">· ${esc(p.city)}${p.birth?" · geb. "+fmtDate(parseLocal(p.birth)):""}</span></button>`).join("")
          : `<button type="button" id="mkNew">Kein Treffer. Neuen Patienten „${esc(inp.value)}“ anlegen</button>`;
        sg.hidden=false;
        $$("[data-pid]",sg).forEach(b=>b.onmousedown=e=>{e.preventDefault();a.patientId=b.dataset.pid;mode="chosen";renderPat();});
        const mk=$("#mkNew",sg); if(mk) mk.onmousedown=e=>{e.preventDefault(); const parts=inp.value.trim().split(/\s+/); newP.first=parts.slice(0,-1).join(" ")||parts[0]||""; newP.last=parts.length>1?parts[parts.length-1]:""; mode="new"; renderPat();};
      };
      inp.oninput=show; inp.onfocus=show; inp.onblur=()=>setTimeout(()=>sg.hidden=true,120);
      setTimeout(()=>inp.focus(),30);
    } else {
      inner.innerHTML=`
        <div class="grid2">
          <div class="field"><label for="np-first">Vorname *</label><input id="np-first" value="${esc(newP.first)}"></div>
          <div class="field"><label for="np-last">Nachname *</label><input id="np-last" value="${esc(newP.last)}"></div>
        </div>
        <div class="field" style="margin-top:.6rem"><label for="np-street">Straße und Hausnummer *</label><input id="np-street" value="${esc(newP.street)}" autocomplete="street-address"></div>
        <div class="grid2" style="margin-top:.6rem;grid-template-columns:1fr 2fr">
          <div class="field"><label for="np-zip">PLZ *</label><input id="np-zip" inputmode="numeric" maxlength="5" value="${esc(newP.zip)}"></div>
          <div class="field"><label for="np-city">Ort *</label><input id="np-city" value="${esc(newP.city)}"></div>
        </div>
        <div class="grid3" style="margin-top:.6rem;grid-template-columns:1fr 1fr 1fr">
          <div class="field"><label for="np-birth">Geburtsdatum</label><input id="np-birth" type="date" value="${esc(newP.birth)}"></div>
          <div class="field"><label for="np-phone">Telefon</label><input id="np-phone" type="tel" value="${esc(newP.phone)}"></div>
          <div class="field"><label for="np-email">E-Mail</label><input id="np-email" type="email" value="${esc(newP.email)}"></div>
        </div>
        <p class="muted" style="font-size:.85rem;margin:.5rem 0 0">* Pflichtfelder. Die Adresse brauchen wir für die Rechnung.</p>`;
      ["first","last","street","zip","city","birth","phone","email"].forEach(k=>{ $("#np-"+k).oninput=e=>newP[k]=e.target.value; });
    }
  }

  function renderItems(){
    const wrap=$("#items");
    const opts = sel => S.services.filter(s=>s.active||s.id===sel).map(s=>`<option value="${s.id}" ${s.id===sel?"selected":""}>${esc(s.name)} · ${s.duration} Min · ${eur(s.price)}</option>`).join("");
    wrap.innerHTML = a.serviceIds.length ? a.serviceIds.map((sid,i)=>`<div class="item-row"><select data-i="${i}" aria-label="Leistung ${i+1}" ${locked?"disabled":""}>${opts(sid)}</select>${locked||a.serviceIds.length<2?"":`<button type="button" class="btn ghost sm" data-rm="${i}" aria-label="Entfernen">✕</button>`}</div>`).join("")
      : `<div class="alert warn">Noch keine Leistungen angelegt. Unter „Leistungen“ können Sie Ihre Behandlungen mit Preisen anlegen.</div>`;
    $$("select[data-i]",wrap).forEach(s=>s.onchange=()=>{a.serviceIds[+s.dataset.i]=s.value;sync();});
    $$("[data-rm]",wrap).forEach(b=>b.onclick=()=>{a.serviceIds.splice(+b.dataset.rm,1);renderItems();sync();});
    $("#sum").textContent=eur(apptTotal(a));
  }
  function sync(){
    if(!durManual){ a.duration=a.serviceIds.reduce((t,i)=>t+(svc(i)?.duration||0),0)||30; $("#ap-dur").value=a.duration; }
    $("#sum").textContent=eur(apptTotal(a));
    checkOverlap();
  }
  function checkOverlap(){
    const d=$("#ap-date").value, t=$("#ap-time").value; const box=$("#overlapMsg");
    if(!d||!t){ box.innerHTML=""; return; }
    const o=overlaps(`${d}T${t}`,+$("#ap-dur").value||0,a.id);
    const s=parseLocal(`${d}T${t}`);
    box.innerHTML = (o.length?`<div class="alert warn">Überschneidung mit ${o.map(x=>`${x.start.slice(11,16)} ${esc(pname(pat(x.patientId)))}`).join(", ")}.</div>`:"")
      + `<div class="muted" style="font-size:.85rem;margin-top:.3rem">${fmtDay(s)}, ${hm(s)} – ${hm(addMin(s,+$("#ap-dur").value||0))} Uhr</div>`;
  }

  renderPat(); renderItems(); checkOverlap();
  if(!locked){
    $("#addItem").onclick=()=>{ const f=S.services.find(s=>s.active); if(f){a.serviceIds.push(f.id);renderItems();sync();} };
    $("#ap-dur").oninput=()=>{durManual=true;checkOverlap();};
    $("#ap-date").oninput=checkOverlap; $("#ap-time").oninput=checkOverlap;
    $$("[data-st]").forEach(b=>b.onclick=()=>{a.status=b.dataset.st;$$("[data-st]").forEach(x=>x.setAttribute("aria-pressed",x===b));});
  }

  function collect(){
    const err=[];
    if(mode==="new"){
      if(!newP.first.trim()||!newP.last.trim()) err.push("Vor- und Nachname des Patienten fehlen.");
      if(!newP.street.trim()||!newP.zip.trim()||!newP.city.trim()) err.push("Die Adresse ist unvollständig. Sie wird für die Rechnung gebraucht.");
      else if(!/^\d{5}$/.test(newP.zip.trim())) err.push("Die PLZ muss fünf Ziffern haben.");
    } else if(!a.patientId) err.push("Bitte einen Patienten auswählen oder neu anlegen.");
    if(!$("#ap-date").value||!$("#ap-time").value) err.push("Datum und Uhrzeit fehlen.");
    if(!a.serviceIds.length) err.push("Bitte mindestens eine Leistung wählen.");
    $("#formErr").innerHTML = err.length?`<div class="alert bad">${err.map(esc).join("<br>")}</div>`:"";
    return !err.length;
  }
  function persist(){
    if(mode==="new"){ const p=Object.assign({id:uid(),createdAt:ymd(new Date())},Object.fromEntries(Object.entries(newP).map(([k,v])=>[k,v.trim()]))); S.patients.push(p); a.patientId=p.id; }
    a.start=`${$("#ap-date").value}T${$("#ap-time").value}`; a.duration=+$("#ap-dur").value||30; a.note=$("#ap-note").value;
    if(existing){ Object.assign(existing,a); } else { a.id=uid(); S.appts.push(a); }
    save(); return existing||a;
  }
  const saveBtn=$("#saveAppt");
  if(saveBtn) saveBtn.onclick=()=>{ if(!collect()) return; const r=persist(); UI.cursor=parseLocal(r.start); closeModal(); render(); toast(existing?"Termin gespeichert":"Termin angelegt"); };
  const del=$("#delAppt");
  if(del) del.onclick=()=>{
    if(del.dataset.armed){ S.appts=S.appts.filter(x=>x.id!==existing.id); save(); closeModal(); render(); toast("Termin gelöscht"); }
    else { del.dataset.armed="1"; del.textContent="Wirklich löschen?"; }
  };
  const bill=$("#billNow");
  if(bill) bill.onclick=()=>{ if(!collect()) return; const r=persist(); const inv=createInvoice(r.patientId,[r.id]); save(); closeModal(); render(); if(inv) openInvoice(inv.id); };
  const si=$("#showInv"); if(si) si.onclick=()=>openInvoice(a.invoiceId);
}

      <div class="section"><span class="label">Rechnungen (${invs.length})</span>

function openService(id){
  const s = id ? svc(id) : {name:"",code:"",duration:30,price:0,active:true};
  const used = id ? S.appts.some(a=>a.serviceIds.includes(id)) : false;
  const ov=modal(`
    <div class="modal-head"><h2>${id?"Leistung bearbeiten":"Neue Leistung"}</h2><button class="btn ghost sm" data-close aria-label="Schließen">✕</button></div>

      </div>

      <div id="sfErr"></div>
    </form>
    <div class="modal-foot">
      ${id?`<div class="left"><button class="btn ${used?"":"danger"}" id="sfArch">${used?(s.active?"Archivieren":"Reaktivieren"):"Löschen"}</button></div>`:""}
      <button class="btn" data-close>Abbrechen</button><button class="btn primary" id="sfSave">Speichern</button>
    </div>`);
  $$("[data-close]",ov).forEach(b=>b.onclick=closeModal);
  $("#sfSave").onclick=()=>{
    const name=$("#sf-name").value.trim(), dur=+$("#sf-dur").value, price=Math.round(parseFloat($("#sf-price").value)*100)/100;
    const err=[]; if(!name) err.push("Bitte eine Bezeichnung eingeben."); if(!(dur>0)) err.push("Die Dauer muss größer als 0 sein."); if(!(price>=0)) err.push("Bitte einen gültigen Preis eingeben.");

    const data={name,code:$("#sf-code").value.trim(),duration:dur,price};
    if(id) Object.assign(s,data); else S.services.push(Object.assign({id:uid(),active:true},data));
    save(); closeModal(); render(); toast("Leistung gespeichert");
  };
  const ar=$("#sfArch");
  if(ar) ar.onclick=()=>{ if(used){ s.active=!s.active; } else { S.services=S.services.filter(x=>x.id!==id); } save(); closeModal(); render(); toast(used?(s.active?"Leistung reaktiviert":"Leistung archiviert"):"Leistung gelöscht"); };
}

  return "";
}

function buildPdf(i){
  const { jsPDF } = window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"}); const pr=i.practice; const L=25, R=190;
  doc.setFont("helvetica","normal");
  doc.setFontSize(7.5); doc.setTextColor(110);
  doc.text(`${pr.name} · ${pr.street} · ${pr.zip} ${pr.city}`, L, 50);
  doc.setDrawColor(160); doc.line(L,51,L+85,51);
  doc.setFontSize(10.5); doc.setTextColor(20);
  doc.text([i.patient.name,i.patient.street,`${i.patient.zip} ${i.patient.city}`], L, 58);
  doc.setFont("helvetica","bold"); doc.text(pr.name, R, 22, {align:"right"});
  doc.setFont("helvetica","normal"); doc.setFontSize(9);
  doc.text([`${pr.owner}, ${pr.title}`,pr.street,`${pr.zip} ${pr.city}`,pr.phone,pr.email], R, 27, {align:"right"});
  doc.setFontSize(9); doc.text([`Rechnungsnr.: ${i.number}`,`Datum: ${fmtDate(parseLocal(i.date))}`].concat(i.patient.birth?[`Geb.-Datum Patient: ${fmtDate(parseLocal(i.patient.birth))}`]:[]), R, 58, {align:"right"});
  doc.setFont("helvetica","bold"); doc.setFontSize(15);
  doc.text(`Rechnung${i.status==="storniert"?" (storniert)":""}`, L, 95);
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
  const per=fmtDate(parseLocal(i.period[0]))+(i.period[1]!==i.period[0]?" – "+fmtDate(parseLocal(i.period[1])):"");
  doc.text(`Behandlungszeitraum: ${per}`, L, 102);
  let y=114; const cols={d:L,z:L+24,n:L+42,q:R-28,b:R};
  doc.setFontSize(8.5); doc.setTextColor(100);
  doc.text("Datum",cols.d,y); doc.text("Ziffer",cols.z,y); doc.text("Leistung",cols.n,y); doc.text("Anz.",cols.q,y,{align:"right"}); doc.text("Betrag",cols.b,y,{align:"right"});
  doc.setDrawColor(200); doc.line(L,y+2,R,y+2); y+=8; doc.setTextColor(20); doc.setFontSize(9.5);
  i.lines.forEach(l=>{
    if(y>255){ doc.addPage(); y=25; }
    const name=doc.splitTextToSize(l.name, cols.q-cols.n-14);
    doc.text(fmtDate(parseLocal(l.date)),cols.d,y); doc.text(l.code||"–",cols.z,y); doc.text(name,cols.n,y);
    doc.text(String(l.qty),cols.q,y,{align:"right"}); doc.text(eurPdf(l.qty*l.price),cols.b,y,{align:"right"});
    y+=6*name.length; doc.setDrawColor(230); doc.line(L,y-3.5,R,y-3.5);
  });
  y+=2; doc.setDrawColor(40); doc.setLineWidth(.5); doc.line(L,y-3,R,y-3); doc.setLineWidth(.2);
  doc.setFont("helvetica","bold"); doc.text("Gesamtbetrag",cols.n,y+2); doc.text(eurPdf(i.total),cols.b,y+2,{align:"right"});
  doc.setFont("helvetica","normal"); y+=14;
  const note=taxNote(pr.taxMode); if(note){ doc.text(doc.splitTextToSize(note,R-L),L,y); y+=8; }
  doc.text(doc.splitTextToSize(`Bitte überweisen Sie den Gesamtbetrag bis zum ${fmtDate(addDays(parseLocal(i.date),i.payDays))} unter Angabe der Rechnungsnummer ${i.number} auf das unten genannte Konto.`,R-L),L,y);
  doc.setDrawColor(190); doc.line(L,277,R,277); doc.setFontSize(7.5); doc.setTextColor(100);
  doc.text(`${pr.name} · ${pr.owner} · Steuernr. ${pr.taxNo}`,L,281);
  doc.text(`${pr.bank} · IBAN ${pr.iban}`,L,285);
  return doc;
}

async function downloadPdf(i){
  const msg=$("#dlMsg");
  if(!window.jspdf){ msg.innerHTML='<div class="alert bad">Die PDF-Bibliothek konnte nicht geladen werden. Bitte die Seite neu laden.</div>'; return; }
  const doc=buildPdf(i); const filename=`Rechnung_${i.number}_${i.patient.name.replace(/\s+/g,"_")}.pdf`;
  let dl=null; try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(e){ dl=null; }
  if(!dl){ msg.innerHTML='<div class="alert warn">Download ist in dieser Ansicht nicht verfügbar. Die Vorschau oben entspricht dem PDF.</div>'; return; }
  try{ await dl.save({filename,data:new Blob([doc.output("arraybuffer")],{type:"application/pdf"})}); toast("PDF gespeichert"); }
  catch(e){ if(e&&e.code==="declined") return; msg.innerHTML=`<div class="alert warn">Das PDF konnte nicht gespeichert werden (${esc(e&&e.code||"unbekannt")}).</div>`; }
}

/* ---------- Statistik ---------- */
const MONTHS = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const MONTHS_LONG = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const eur0 = n => new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);
const eurShort = n => n>=1000 ? (n/1000).toLocaleString("de-DE",{maximumFractionDigits:1})+" T€" : Math.round(n)+" €";
function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw||1))); const f=raw/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function roundTop(x,y,w,h,r){ r=Math.min(r,w/2,h); if(h<=0) return ""; return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`; }
function roundRight(x,y,w,h,r){ r=Math.min(r,h/2,w); if(w<=0) return ""; return `M${x},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h-r}Q${x+w},${y+h} ${x+w-r},${y+h}H${x}Z`; }

function yearStats(y){
  const ys=String(y);
  const inv=S.invoices.filter(i=>i.status!=="storniert"&&i.date.startsWith(ys));
  const months=Array.from({length:12},()=>({paid:0,open:0,count:0}));
  inv.forEach(i=>{ const m=+i.date.slice(5,7)-1; months[m][i.status==="bezahlt"?"paid":"open"]+=i.total; months[m].count++; });
  const total=inv.reduce((t,i)=>t+i.total,0), paid=inv.filter(i=>i.status==="bezahlt").reduce((t,i)=>t+i.total,0);
  const appts=S.appts.filter(a=>a.start.startsWith(ys));
  const done=appts.filter(a=>a.status==="durchgefuehrt").length, noshow=appts.filter(a=>a.status==="ausgefallen").length;
  const bySvc={}; inv.forEach(i=>i.lines.forEach(l=>{ bySvc[l.name]=(bySvc[l.name]||0)+l.qty*l.price; }));
  return {inv,months,total,paid,open:total-paid,done,noshow,bySvc};
}

      <div class="panel kpi"><div class="label">Davon bezahlt</div><div class="v num">${eur0(st.paid)}</div><div class="muted" style="font-size:.85rem">Offen: <span class="num">${eur0(st.open)}</span></div></div>
      <div class="panel kpi"><div class="label">Ø pro Monat</div><div class="v num">${eur0(avg)}</div><div class="muted" style="font-size:.85rem">über ${lastM+1} Monat${lastM?"e":""}</div></div>
      <div class="panel kpi"><div class="label">Behandlungen</div><div class="v num">${st.done.toLocaleString("de-DE")}</div><div class="muted" style="font-size:.85rem">Ausfallquote <span class="num">${quote.toLocaleString("de-DE",{maximumFractionDigits:1})} %</span></div></div>
    </div>
    ${isCur&&toBill?`<div class="alert warn" style="margin-bottom:16px;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">Noch nicht abgerechnet: <strong class="num">${eur(toBill)}</strong> aus ${billable().length} durchgeführten Terminen. <button class="btn sm" data-go2="rechnungen">Jetzt abrechnen</button></div>`:""}
    <div class="panel chart-card">
      <div class="chart-head"><div><h2>Umsatz pro Monat ${y}</h2><p class="muted" style="margin:.15rem 0 0;font-size:.88rem">Nach Rechnungsdatum, ohne stornierte Rechnungen</p></div>

        <tbody>${st.months.map((m,i)=>`<tr><td>${MONTHS_LONG[i]}</td><td class="r num">${m.count}</td><td class="r num">${eur(m.paid)}</td><td class="r num">${eur(m.open)}</td><td class="r num"><strong>${eur(m.paid+m.open)}</strong></td></tr>`).join("")}

  $$("[data-year]").forEach(b=>b.onclick=()=>{UI.statYear=+b.dataset.year;render();});

function drawMonthly(el, months, y){
  const W=Math.max(300, el.clientWidth), H=W<500?220:280, m={t:24,r:8,b:28,l:W<500?40:56};
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const totals=months.map(x=>x.paid+x.open), max=Math.max(...totals,1);
  const step=niceStep(max/4), top=Math.ceil(max/step)*step;
  const sy=v=>m.t+ih-(v/top)*ih, bw=iw/12, barW=Math.min(36,bw*0.62);
  const now=new Date(); const future=i=> y===now.getFullYear() && i>now.getMonth();
  const maxI=totals.indexOf(Math.max(...totals));
  let g="";
  for(let v=0; v<=top+0.001; v+=step){ g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${sy(v)}" y2="${sy(v)}" class="${v===0?"axis":"grid"}"/><text x="${m.l-8}" y="${sy(v)+4}" text-anchor="end" class="tick">${W<500?eurShort(v):eur0(v)}</text>`; }
  let bars="";
  months.forEach((x,i)=>{
    const cx=m.l+bw*i+bw/2, x0=cx-barW/2; const hp=(x.paid/top)*ih, ho=(x.open/top)*ih;
    const gap = hp>0&&ho>0 ? 2 : 0;
    if(hp>0) bars+= ho>0 ? `<rect x="${x0}" y="${sy(x.paid)}" width="${barW}" height="${hp}" fill="var(--c1)"/>` : `<path d="${roundTop(x0,sy(x.paid),barW,hp,4)}" fill="var(--c1)"/>`;
    if(ho>0) bars+=`<path d="${roundTop(x0,sy(x.paid+x.open),barW,Math.max(0,ho-gap),4)}" fill="var(--c2)"/>`;
    if(future(i)) bars+=`<text x="${cx}" y="${sy(0)-6}" text-anchor="middle" class="tick">–</text>`;
    bars+=`<text x="${cx}" y="${H-8}" text-anchor="middle" class="tick">${MONTHS[i]}</text>`;
    bars+=`<rect class="hit" data-i="${i}" x="${m.l+bw*i}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent"/>`;
  });
  const lbl = totals[maxI]>0 ? `<text x="${m.l+bw*maxI+bw/2}" y="${sy(totals[maxI])-7}" text-anchor="middle" class="dlabel">${eur0(totals[maxI])}</text>` : "";
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Umsatz pro Monat ${y}, gestapelt nach bezahlt und offen">${g}${bars}${lbl}<rect id="hl" x="${m.l}" y="${m.t}" width="${bw}" height="${ih}" class="hl" style="display:none"/></svg><div class="tip" hidden></div>`;
  const tip=$(".tip",el), hl=$("#hl",el), svg=$("svg",el);
  // Hervorhebung hinter die Balken legen
  svg.insertBefore(hl, svg.querySelector("rect,path"));
  $$(".hit",el).forEach(r=>{
    const show=()=>{ const i=+r.dataset.i, x=months[i]; hl.setAttribute("x",m.l+bw*i); hl.style.display="";
      tip.innerHTML=`<strong>${MONTHS_LONG[i]} ${y}</strong><div class="tr"><i class="sw" style="background:var(--c1)"></i>Bezahlt<span class="num">${eur(x.paid)}</span></div><div class="tr"><i class="sw" style="background:var(--c2)"></i>Offen<span class="num">${eur(x.open)}</span></div><div class="tr tot">Gesamt<span class="num">${eur(x.paid+x.open)}</span></div><div class="muted" style="font-size:.8rem">${x.count} Rechnung${x.count===1?"":"en"}</div>`;
      tip.hidden=false; const cx=m.l+bw*i+bw/2; const tw=tip.offsetWidth; let left=cx+12; if(left+tw>W) left=cx-12-tw; tip.style.left=Math.max(0,left)+"px"; tip.style.top=(m.t)+"px"; };
    r.addEventListener("mouseenter",show); r.addEventListener("click",show);
    r.addEventListener("mouseleave",()=>{tip.hidden=true;hl.style.display="none";});
  });
}

function drawServices(el, rows, total){
  if(!rows.length){ el.innerHTML='<div class="empty">Für dieses Jahr gibt es noch keine Rechnungen.</div>'; return; }
  const W=Math.max(300, el.clientWidth), rowH=34, labelW=Math.min(220, W*0.42), valW=W<500?64:120;
  const H=rows.length*rowH+8, iw=W-labelW-valW-8, max=rows[0][1], maxCh=Math.floor((labelW-12)/6.6);
  let s="";
  rows.forEach(([name,v],i)=>{ const y=4+i*rowH, w=Math.max(2,(v/max)*iw);
    s+=`<g class="srow"><title>${esc(name)}: ${eur(v)} (${(v/total*100).toLocaleString("de-DE",{maximumFractionDigits:1})} %)</title>
      <text x="${labelW-10}" y="${y+rowH/2+4}" text-anchor="end" class="slabel">${esc(name.length>maxCh?name.slice(0,maxCh-1)+"…":name)}</text>
      <path d="${roundRight(labelW,y+7,w,rowH-14,4)}" fill="var(--c1)"/>
      <text x="${labelW+w+8}" y="${y+rowH/2+4}" class="dlabel">${W<500?eurShort(v):eur0(v)+" · "+(v/total*100).toLocaleString("de-DE",{maximumFractionDigits:0})+" %"}</text></g>`; });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Umsatz nach Leistung">${s}</svg>`;
}

      <div class="grid2">${f("bank","Bank")}${f("iban","IBAN")}</div>
      <div class="field"><label for="st-taxMode">Umsatzsteuer-Hinweis auf der Rechnung</label>
        <select id="st-taxMode">
          <option value="p4" ${p.taxMode==="p4"?"selected":""}>Heilbehandlung steuerfrei (§ 4 Nr. 14 UStG)</option>
          <option value="p19" ${p.taxMode==="p19"?"selected":""}>Kleinunternehmer (§ 19 UStG)</option>
          <option value="none" ${p.taxMode==="none"?"selected":""}>Kein Hinweis</option>
        </select></div>
      <div><button class="btn primary" type="submit">Speichern</button></div>
    </form>
    <div class="panel" style="padding:18px;margin-top:16px;max-width:720px;display:flex;flex-direction:column;gap:.5rem">
      <h2>Prototyp-Daten</h2>
      <p class="muted" style="margin:0">Alle Daten liegen nur in diesem Browser. Sie können Ihre Praxis mit Beispieldaten aus fast zwei Jahren füllen, um Kalender, Rechnungen und Statistik auszuprobieren.</p>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn" id="loadDemo">Beispieldaten in meine Praxis laden</button><button class="btn danger" id="reset">Gesamten Prototyp zurücksetzen</button></div>
    </div>`;
  const ld=$("#loadDemo"); ld.onclick=()=>{ if(!ld.dataset.armed){ld.dataset.armed="1";ld.textContent="Ersetzt alle Daten dieser Praxis. Fortfahren?";return;} const acc=me(); DB.data[acc.id]=seedPractice(); bindSession(); save(); render(); toast("Beispieldaten geladen"); };
  $("#stForm").addEventListener("submit",e=>{ e.preventDefault();
    ["name","owner","title","street","zip","city","phone","email","taxNo","bank","iban"].forEach(k=>p[k]=$("#st-"+k).value.trim());
    p.payDays=Math.max(0,parseInt($("#st-payDays").value)||14); p.taxMode=$("#st-taxMode").value; save(); toast("Praxisdaten gespeichert"); });
  const r=$("#reset"); r.onclick=()=>{ if(!r.dataset.armed){r.dataset.armed="1";r.textContent="Wirklich alles zurücksetzen?";return;} const sid=DB.session; DB=seedDB(); if(DB.accounts.some(a=>a.id===sid)) DB.session=sid; bindSession(); save(); render(); toast("Prototyp zurückgesetzt"); };
}

render();
})();
</script>
</body></html>
